name: Android APK

# android/ か Web側が変わったら、スマホに入れられる APK を作って Releases に置く
on:
  push:
    branches: [main, v0.2-kaze]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle -p android assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk popo-sanpo.apk

      - uses: actions/upload-artifact@v4
        with:
          name: popo-sanpo-apk
          path: popo-sanpo.apk

      - name: Publish to Releases (android-latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: ポポさんぽ Android（最新）
          prerelease: true
          body: |
            スマホで popo-sanpo.apk をダウンロードして開くと入ります。
            「提供元不明のアプリ」の許可が1回だけ必要です。
            起動時に「身体活動」の許可を聞かれたら「許可」を押してください。
          files: popo-sanpo.apk
