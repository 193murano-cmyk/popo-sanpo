<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#bfe7ff">
<meta name="description" content="ポポと一緒におさんぽ。歩いた分だけポイントが貯まるよ。">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>ポポさんぽ</title>
<link rel="manifest" href="./manifest.json">
<style>
/* ===== ベース（ポポの空色テーマ） ===== */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; min-height: 100%;
  font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
  background: #cdeeff; color: #2b3a4a;
  -webkit-tap-highlight-color: transparent;
  user-select: none; -webkit-user-select: none;
}
body {
  background:
    radial-gradient(ellipse 70% 40% at 20% 8%, rgba(255,255,255,.9) 0%, transparent 60%),
    radial-gradient(ellipse 60% 35% at 85% 30%, rgba(255,255,255,.8) 0%, transparent 60%),
    radial-gradient(ellipse 80% 40% at 50% 100%, rgba(255,255,255,.9) 0%, transparent 60%),
    linear-gradient(180deg, #9fdcff 0%, #bfe7ff 40%, #dff4ff 100%);
  background-attachment: fixed;
}

#app {
  max-width: 480px; margin: 0 auto;
  padding: calc(env(safe-area-inset-top) + 16px) 20px calc(env(safe-area-inset-bottom) + 24px);
  display: flex; flex-direction: column; gap: 18px; align-items: center;
  text-align: center;
}

/* ===== ヘッダー ===== */
header { width: 100%; display: flex; align-items: center; justify-content: space-between; }
header a {
  color: #2b6a9a; text-decoration: none; font-size: 14px;
  padding: 8px 12px; border-radius: 999px; background: rgba(255,255,255,.7);
}
header h1 { font-size: 19px; font-weight: 700; letter-spacing: .08em; color: #d5182a; }
header .spacer { width: 64px; }

/* ===== ポポ ===== */
#stage { position: relative; width: 210px; height: 210px; }
#stage::before {
  content: ''; position: absolute; inset: -14px; border-radius: 50%;
  background: radial-gradient(circle, rgba(255,255,255,.9) 0%, rgba(255,255,255,0) 68%);
  opacity: .7; transition: opacity 1s;
}
#stage.goal::before {
  opacity: 1;
  background: radial-gradient(circle, rgba(255,230,120,.95) 0%, rgba(255,230,120,0) 70%);
  animation: glow 2.4s ease-in-out infinite;
}
@keyframes glow { 50% { transform: scale(1.12); } }
.popo {
  position: absolute; inset: 0; width: 100%; height: 100%;
  object-fit: contain; opacity: 0; transition: opacity .5s;
  pointer-events: none;
  filter: drop-shadow(0 8px 14px rgba(40,90,130,.22));
}
.popo.active { opacity: 1; }
#stage.step .popo.active { animation: hop .32s ease-out; }
@keyframes hop { 30% { transform: translateY(-9px) scale(1.03); } }
#stage.walking .popo.active { animation: bob 1.1s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-6px) rotate(2deg); } }

/* ===== 数字 ===== */
.big { line-height: 1; }
.big .num { font-size: 66px; font-weight: 700; letter-spacing: -.02em; color: #d5182a; }
.big .unit { font-size: 16px; color: #2b6a9a; margin-left: 6px; font-weight: 600; }
.label { font-size: 13px; color: #2b6a9a; letter-spacing: .15em; margin-bottom: 6px; }

#bar { width: 100%; height: 12px; border-radius: 999px; background: rgba(255,255,255,.8); overflow: hidden; border: 1px solid rgba(43,106,154,.15); }
#bar-fill {
  height: 100%; width: 0%; border-radius: 999px;
  background: linear-gradient(90deg, #ff6b7a, #d5182a 60%, #ffb400);
  transition: width .4s ease;
}
#goal-text { font-size: 13px; color: #2b6a9a; margin-top: 8px; }

/* ===== ポイント ===== */
#points-card {
  width: 100%; padding: 16px; border-radius: 22px;
  background: rgba(255,255,255,.85); border: 2px solid #fff;
  box-shadow: 0 8px 24px rgba(40,90,130,.12);
  display: flex; justify-content: space-around; align-items: center;
}
#points-card .k { font-size: 12px; color: #2b6a9a; letter-spacing: .12em; }
#points-card .v { font-size: 30px; font-weight: 700; color: #e0a000; margin-top: 4px; }
#points-card .v.red { color: #d5182a; }

/* ===== ボタン ===== */
button {
  font: inherit; border: none; cursor: pointer; color: inherit;
  -webkit-tap-highlight-color: transparent;
}
#start {
  width: 100%; padding: 18px; border-radius: 999px; font-size: 18px; font-weight: 700; letter-spacing: .1em;
  background: linear-gradient(135deg, #ff4d5e, #d5182a); color: #fff;
  box-shadow: 0 8px 24px rgba(213,24,42,.3);
  transition: transform .1s, filter .2s;
}
#start:active { transform: scale(.97); }
#start.on { background: linear-gradient(135deg, #4aa3df, #2b6a9a); box-shadow: 0 8px 24px rgba(43,106,154,.3); }
#status { font-size: 13px; color: #2b6a9a; min-height: 1.4em; }

.small-btn {
  padding: 10px 16px; border-radius: 999px; font-size: 14px;
  background: rgba(255,255,255,.85); color: #2b3a4a; border: 1px solid rgba(43,106,154,.2);
}
.small-btn:active { background: #fff; }
#manual { display: none; gap: 10px; }
#manual.show { display: flex; }

/* ===== 歩数アプリと同期 ===== */
#sync { width: 100%; padding: 14px 16px; border-radius: 22px; background: rgba(255,255,255,.7); text-align: left; }
#sync .title { font-size: 13px; font-weight: 700; color: #2b3a4a; margin-bottom: 8px; }
.sync-row { display: flex; gap: 8px; }
#sync-input {
  flex: 1; min-width: 0; font: inherit; font-size: 16px; padding: 10px 12px; border-radius: 12px;
  border: 1px solid rgba(43,106,154,.25); background: #fff; color: #2b3a4a;
}
#sync .hint { font-size: 11px; color: #4f7a9a; margin-top: 8px; line-height: 1.5; }

/* ===== 目標設定 ===== */
.row { width: 100%; display: flex; align-items: center; justify-content: space-between; font-size: 14px; color: #2b3a4a; }
select {
  font: inherit; padding: 8px 12px; border-radius: 10px;
  background: rgba(255,255,255,.9); color: #2b3a4a; border: 1px solid rgba(43,106,154,.25);
}

/* ===== 1週間のグラフ ===== */
#week { width: 100%; padding: 14px 16px 12px; border-radius: 22px; background: rgba(255,255,255,.7); }
#week .title { font-size: 12px; color: #2b6a9a; letter-spacing: .15em; margin-bottom: 10px; }
#bars { display: flex; gap: 8px; align-items: flex-end; height: 90px; }
#bars .day { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; justify-content: flex-end; }
#bars .col { width: 100%; border-radius: 6px 6px 3px 3px; background: rgba(43,106,154,.2); min-height: 3px; transition: height .5s; }
#bars .col.hit { background: linear-gradient(180deg, #ffb400, #d5182a); }
#bars .col.today { background: #ff6b7a; }
#bars .d { font-size: 10px; color: #2b6a9a; }

/* ===== トースト ===== */
#toast {
  position: fixed; left: 50%; bottom: 40px; transform: translateX(-50%) translateY(20px);
  padding: 12px 20px; border-radius: 999px; font-size: 14px; font-weight: 700;
  background: #ffd23f; color: #5a3a00; opacity: 0; pointer-events: none;
  transition: opacity .3s, transform .3s; box-shadow: 0 8px 24px rgba(0,0,0,.2);
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

footer { font-size: 11px; color: #4f7a9a; line-height: 1.6; }
</style>
</head>
<body>
<div id="app">
  <header>
    <span class="spacer"></span>
    <h1>ポポさんぽ</h1>
    <span class="spacer"></span>
  </header>

  <div id="stage">
    <img class="popo active" data-mood="idle"    src="./img/popo_idle.png"   alt="ポポ" draggable="false">
    <img class="popo"        data-mood="walking" src="./img/popo_walk.png"   alt="ポポ（おさんぽ中）" draggable="false">
    <img class="popo"        data-mood="done"    src="./img/popo_good.png"   alt="ポポ（グッド）" draggable="false">
    <img class="popo"        data-mood="yay"     src="./img/popo_yay.png"   alt="ポポ（やったー）" draggable="false">
    <img class="popo"        data-mood="goal"    src="./img/popo_sparkle.png" alt="ポポ（きらきら）" draggable="false">
  </div>

  <div>
    <div class="label">きょうの歩数</div>
    <div class="big"><span class="num" id="steps">0</span><span class="unit">歩</span></div>
  </div>

  <div style="width:100%">
    <div id="bar"><div id="bar-fill"></div></div>
    <div id="goal-text">目標まであと 3,000 歩</div>
  </div>

  <div id="points-card">
    <div><div class="k">きょう</div><div class="v red" id="today-pts">0 pt</div></div>
    <div><div class="k">ぜんぶ</div><div class="v" id="total-pts">0 pt</div></div>
  </div>

  <button id="start">さんぽスタート</button>
  <div id="status">スタートを押したら、ぼくと一緒に歩こうだね！</div>

  <div id="manual">
    <button class="small-btn" data-add="10">+10歩</button>
    <button class="small-btn" data-add="100">+100歩</button>
  </div>

  <div id="sync">
    <div class="title">📱 Google Fit・ヘルスコネクトの歩数を入れる</div>
    <div class="sync-row">
      <input id="sync-input" type="number" inputmode="numeric" min="0" max="99999" placeholder="きょうの歩数">
      <button class="small-btn" id="sync-btn">同期する</button>
    </div>
    <div class="hint">スマホの歩数アプリに出ている「今日の歩数」を入れると、その数に合わせるよ</div>
  </div>

  <div class="row">
    <span>1日の目標</span>
    <select id="goal">
      <option value="1000">1,000歩</option>
      <option value="3000" selected>3,000歩</option>
      <option value="5000">5,000歩</option>
      <option value="8000">8,000歩</option>
      <option value="10000">10,000歩</option>
    </select>
  </div>

  <div id="week">
    <div class="title">この1週間</div>
    <div id="bars"></div>
  </div>

  <footer>
    1歩 = 1ポイント。目標を達成した日は ボーナス +500pt。<br>
    歩数はこのスマホの中だけに保存されます。
  </footer>
</div>
<div id="toast"></div>

<script>
(() => {
'use strict';

/* ===== 設定 ===== */
const GOAL_BONUS   = 500;   // 目標達成ボーナス
const STEP_THRESH  = 1.1;   // これ以上の揺れで1歩 (m/s²)
const STEP_MIN_MS  = 280;   // 歩と歩の最短間隔 (ms)
const SAVE_KEY     = 'popo_sanpo_v1';

/* ===== 保存データ ===== */
const dateKey = (d) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const today = () => dateKey(new Date());
let data = { days: {}, bonus: {}, goal: 3000 };
try {
  const raw = localStorage.getItem(SAVE_KEY);
  if (raw) data = Object.assign(data, JSON.parse(raw));
} catch (e) {}
const save = () => { try { localStorage.setItem(SAVE_KEY, JSON.stringify(data)); } catch (e) {} };

/* ===== 画面の部品 ===== */
const $ = (id) => document.getElementById(id);
const el = {
  stage: $('stage'),
  steps: $('steps'), fill: $('bar-fill'), goalText: $('goal-text'),
  todayPts: $('today-pts'), totalPts: $('total-pts'),
  start: $('start'), status: $('status'), manual: $('manual'),
  goal: $('goal'), bars: $('bars'), toast: $('toast'),
};
const popoImgs = Array.from(document.querySelectorAll('.popo'));
el.goal.value = String(data.goal);

/* ===== 計算 ===== */
const stepsToday = () => data.days[today()] || 0;
const pointsFor  = (day) => (data.days[day] || 0) + (data.bonus[day] ? GOAL_BONUS : 0);
const totalPoints = () => Object.keys(data.days).reduce((s, d) => s + pointsFor(d), 0);
const fmt = (n) => n.toLocaleString('ja-JP');

/* ===== ポポの表情 =====
   idle    : ふつう（何もしてないとき）
   walking : さんぽ中
   done    : さんぽを止めたあと（グッド）
   yay     : 目標達成の瞬間（やったー）
   goal    : 目標達成したあと（きらきら） */
let mood = 'idle';
let yayTimer = null;
function setMood(m) {
  mood = m;
  popoImgs.forEach(img => img.classList.toggle('active', img.dataset.mood === m));
  el.stage.classList.toggle('walking', m === 'walking');
}
function autoMood() {
  if (mood === 'yay') return;                 // お祝い中はそのまま
  if (tracking) setMood('walking');
  else if (stepsToday() >= data.goal) setMood('goal');
  else if (mood === 'done') setMood('done');
  else setMood('idle');
}

/* ===== 画面を更新 ===== */
function render() {
  const s = stepsToday();
  const goalHit = s >= data.goal;
  el.steps.textContent = fmt(s);
  el.fill.style.width = Math.min(100, s / data.goal * 100) + '%';
  el.goalText.textContent = goalHit ? '🎉 きょうの目標たっせい！風がとおるよ' : `目標まであと ${fmt(data.goal - s)} 歩`;
  el.todayPts.textContent = fmt(pointsFor(today())) + ' pt';
  el.totalPts.textContent = fmt(totalPoints()) + ' pt';
  el.stage.classList.toggle('goal', goalHit);
  autoMood();
  renderWeek();
}

function renderWeek() {
  const names = ['日','月','火','水','木','金','土'];
  const days = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date(); d.setDate(d.getDate() - i);
    const key = dateKey(d);
    days.push({ key, name: names[d.getDay()], steps: data.days[key] || 0 });
  }
  const max = Math.max(data.goal, ...days.map(d => d.steps));
  el.bars.innerHTML = days.map(d => {
    const h = Math.max(3, d.steps / max * 70);
    const cls = d.steps >= data.goal ? 'hit' : (d.key === today() ? 'today' : '');
    return `<div class="day" title="${fmt(d.steps)}歩"><div class="col ${cls}" style="height:${h}px"></div><div class="d">${d.name}</div></div>`;
  }).join('');
}

/* ===== 歩数を足す ===== */
function addSteps(n) {
  const key = today();
  const before = data.days[key] || 0;
  data.days[key] = before + n;
  if (before < data.goal && data.days[key] >= data.goal && !data.bonus[key]) {
    data.bonus[key] = true;
    toast(`🎉 目標たっせい！ボーナス +${GOAL_BONUS}pt だね！`);
    if (navigator.vibrate) navigator.vibrate([80, 60, 80, 60, 160]);
    setMood('yay');
    clearTimeout(yayTimer);
    yayTimer = setTimeout(() => { mood = 'idle'; autoMood(); }, 3500);
  }
  save();
  render();
  el.stage.classList.remove('step');
  void el.stage.offsetWidth; // アニメーションをリセット
  el.stage.classList.add('step');
}

let toastTimer = null;
function toast(msg) {
  el.toast.textContent = msg;
  el.toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.toast.classList.remove('show'), 2600);
}

/* ===== 歩数センサー（加速度センサー） ===== */
let tracking = false;
let gravity = null;      // ゆっくり動く成分（重力）
let smooth = 0;          // なめらかにした揺れ
let above = false;       // しきい値を超えている最中か
let lastStepAt = 0;
let gotSensor = false;
let sensorCheck = null;
let wakeLock = null;

function onMotion(e) {
  const a = e.accelerationIncludingGravity;
  if (!a || a.x == null) return;
  gotSensor = true;
  const mag = Math.sqrt(a.x*a.x + a.y*a.y + a.z*a.z);
  if (gravity === null) gravity = mag;
  gravity += (mag - gravity) * 0.1;          // 重力だけをゆっくり追いかける
  const hp = mag - gravity;                  // 重力を引いた「動き」
  smooth += (hp - smooth) * 0.5;             // ちょっとなめらかに
  const now = Date.now();
  if (!above && smooth > STEP_THRESH) {
    above = true;
    if (now - lastStepAt > STEP_MIN_MS) { lastStepAt = now; addSteps(1); }
  } else if (above && smooth < STEP_THRESH * 0.5) {
    above = false;
  }
}

async function requestWakeLock() {
  try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
}

async function startTracking() {
  // iPhone はここで「許可しますか？」が出る
  if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
    try {
      const res = await DeviceMotionEvent.requestPermission();
      if (res !== 'granted') {
        el.status.textContent = 'センサーの許可がもらえなかったよ。設定から許可してね';
        showManual();
        return;
      }
    } catch (e) {
      el.status.textContent = 'センサーが使えないみたい。下のボタンで足せるよ';
      showManual();
      return;
    }
  }
  if (!('DeviceMotionEvent' in window)) {
    el.status.textContent = 'この端末はセンサーが使えないみたい。下のボタンで足せるよ';
    showManual();
    return;
  }
  gravity = null; smooth = 0; above = false; gotSensor = false;
  window.addEventListener('devicemotion', onMotion);
  tracking = true;
  el.start.textContent = 'ストップ';
  el.start.classList.add('on');
  el.status.textContent = '風がとおるよ！ スマホを持って歩こう 🚶';
  autoMood();
  requestWakeLock();
  sensorCheck = setTimeout(() => {
    if (!gotSensor) {
      el.status.textContent = 'センサーの反応がないみたい（https で開いてる？）。下のボタンで足せるよ';
      showManual();
    }
  }, 4000);
}

function stopTracking() {
  window.removeEventListener('devicemotion', onMotion);
  tracking = false;
  clearTimeout(sensorCheck);
  if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; }
  el.start.textContent = 'さんぽスタート';
  el.start.classList.remove('on');
  el.status.textContent = `おつかれさま！きょうは ${fmt(stepsToday())} 歩だね！`;
  if (mood !== 'yay') setMood(stepsToday() >= data.goal ? 'goal' : 'done');
}

function showManual() { el.manual.classList.add('show'); }

/* ===== 操作 ===== */
el.start.addEventListener('click', () => tracking ? stopTracking() : startTracking());
el.manual.addEventListener('click', (e) => {
  const n = Number(e.target.dataset.add);
  if (n) addSteps(n);
});
// 歩数アプリの数字に合わせる（今より多いときだけ足す）
$('sync-btn').addEventListener('click', () => {
  const input = $('sync-input');
  const v = Math.floor(Number(input.value));
  if (!Number.isFinite(v) || v <= 0) { toast('歩数を入れてね'); return; }
  const diff = v - stepsToday();
  if (diff <= 0) { toast(`もう ${fmt(stepsToday())} 歩になってるよ`); return; }
  addSteps(diff);
  input.value = '';
  toast(`${fmt(v)} 歩に合わせたよ！`);
});
el.goal.addEventListener('change', () => {
  data.goal = Number(el.goal.value);
  save(); render();
});
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && tracking) requestWakeLock();
});
// ポポを長押しで手動ボタンを表示（センサーがない端末用）
let pressTimer = null;
el.stage.addEventListener('pointerdown', () => { pressTimer = setTimeout(showManual, 1200); });
el.stage.addEventListener('pointerup',   () => clearTimeout(pressTimer));
el.stage.addEventListener('pointercancel', () => clearTimeout(pressTimer));

render();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}
})();
</script>
</body>
</html>
