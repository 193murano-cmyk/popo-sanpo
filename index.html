<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#9fdcff">
<meta name="description" content="歩くと、風がとおる。ポポと一緒におさんぽ。">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>ポポさんぽ</title>
<link rel="manifest" href="./manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./css/style.css">
</head>
<body>
<div id="app">

  <!-- カナデの額縁：朝と夜のチリン -->
  <div id="frame">
    <div class="bell">🔔</div>
    <div><span class="who">カナデ</span><span id="kanade-line">チリン、はじまりの音♪</span></div>
  </div>

  <!-- ポポと吹き出し -->
  <div id="hero">
    <div id="bubble">…</div>
    <div id="stage">
      <div class="wind w1"></div><div class="wind w2"></div><div class="wind w3"></div>
      <img class="popo active" data-mood="idle"    src="./img/popo_idle.png"    alt="ポポ" draggable="false">
      <img class="popo"        data-mood="walking" src="./img/popo_walk.png"    alt="ポポ（おさんぽ中）" draggable="false">
      <img class="popo"        data-mood="done"    src="./img/popo_good.png"    alt="ポポ（グッド）" draggable="false">
      <img class="popo"        data-mood="yay"     src="./img/popo_yay.png"     alt="ポポ（やったー）" draggable="false">
      <img class="popo"        data-mood="goal"    src="./img/popo_sparkle.png" alt="ポポ（きらきら）" draggable="false">
    </div>
  </div>

  <!-- きょうの風 -->
  <div id="today">
    <div class="label">きょうの風</div>
    <div class="big"><span class="num" id="steps">0</span><span class="unit">歩</span></div>
    <div id="bar"><div id="bar-fill"></div></div>
    <div id="goal-text">風がとおるまで あと 3,000 歩</div>
  </div>

  <!-- 風のとおり道（連続） -->
  <div id="streak">
    <div class="t">風のとおり道<b><em id="streak-num">0</em> 日</b><span id="streak-label"></span></div>
    <div id="coins"></div>
  </div>

  <!-- ご縁 -->
  <div id="points">
    <div><div class="k">きょうのご縁</div><div class="v red"><span class="fiveyen"></span><span id="today-pts">0</span></div></div>
    <div><div class="k">ぜんぶのご縁</div><div class="v gold"><span class="fiveyen"></span><span id="total-pts">0</span></div></div>
  </div>

  <!-- 歩数を入れる（アプリ版では自動） -->
  <div id="sync">
    <div class="title"><span class="manual-only">📱 きょうの歩数を入れる</span><span class="auto-only">🌬️ 歩数は自動</span></div>
    <div class="sync-row manual-only">
      <input id="sync-input" type="number" inputmode="numeric" min="0" max="99999" placeholder="0">
      <button class="btn" id="sync-btn">風にする</button>
    </div>
    <div class="hint manual-only">スマホの歩数アプリに出ている「今日の歩数」を入れてね。<b>アプリ版では自動で入ります。</b></div>
    <div class="hint auto-only" id="sync-note">自動で数えているよ</div>
  </div>

  <details>
    <summary>目標と、さんぽモード</summary>
    <div class="row"><span>1日の目標</span>
      <select id="goal">
        <option value="1000">1,000歩</option>
        <option value="3000" selected>3,000歩</option>
        <option value="5000">5,000歩</option>
        <option value="8000">8,000歩</option>
        <option value="10000">10,000歩</option>
      </select>
    </div>
    <div class="row"><span>画面をつけたまま歩いて数える</span><button class="btn ghost" id="start">さんぽモードをためす</button></div>
    <div id="status"></div>
    <div id="manual"><button class="btn ghost" data-add="10">+10歩</button><button class="btn ghost" data-add="100">+100歩</button></div>
  </details>

  <footer>1歩 = 1ご縁。風がとおった日（目標達成）は +500。<br>記録はこのスマホの中だけに保存されます。</footer>

  <!-- ===== 確認用パネル：URL に ?debug=1 を付けたときだけ表示 ===== -->
  <div id="preview">
    <div class="title">🔧 確認用パネル（?debug=1 のときだけ）</div>
    <div class="row"><span>きょうの歩数</span><input id="pv-steps" type="range" min="0" max="10000" step="50" value="0"><span id="pv-steps-val">0</span></div>
    <div class="row"><span>時間帯</span>
      <select id="pv-time"><option value="">いまの時刻</option><option value="morning">朝</option><option value="day">昼</option><option value="evening">夜</option></select>
    </div>
    <div class="row"><span>連続3日を作る</span><button class="btn" id="pv-streak">つくる</button></div>
    <div class="row"><span>記録をぜんぶ消す</span><button class="btn ghost" id="pv-reset">消す</button></div>
  </div>
</div>
<div id="toast"></div>

<script src="./js/lines.js"></script>
<script src="./js/app.js"></script>
</body>
</html>
